name: homepage

# Builds doc/homepage and publishes it to the root of panel.holoviz.org and the
# panel-dev.holoviz.org staging site. Each bucket is shared with the docs workflow, which
# owns /en/docs/**, /switcher.json, /sitemap.xml and /robots.txt, so nothing here may sync
# with --delete outside /_home/.

on:
  push:
    branches:
      - main
    paths:
      - "doc/homepage/**"
      - ".github/workflows/homepage.yaml"
  workflow_dispatch:
    inputs:
      target:
        description: "Site to deploy to"
        type: choice
        options:
          - dev
          - main
          - dryrun
        required: true
        default: dryrun

defaults:
  run:
    shell: bash -e {0}

permissions: {}

# Never cancel a deploy halfway through its uploads.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  pixi_lock:
    name: Pixi lock
    runs-on: ubuntu-latest
    steps:
      - uses: holoviz-dev/holoviz_tasks/pixi-lock@11eb638302f76ec64217e2eeddfb11df1f788b54 # v1.0.2

  homepage_build:
    name: Build homepage (${{ matrix.site }})
    needs: [pixi_lock]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Pushes keep both sites in sync; a dryrun checks the main site.
        site: ${{ fromJSON(github.event_name == 'push' && '["dev", "main"]' || (github.event.inputs.target == 'dev' && '["dev"]' || '["main"]')) }}
    env:
      # panel-dev has no latest docs build, only dev.
      VITE_DOCS_PATH: ${{ matrix.site == 'dev' && '/en/docs/dev' || '/en/docs/latest' }}
    steps:
      - uses: holoviz-dev/holoviz_tasks/pixi-install@11eb638302f76ec64217e2eeddfb11df1f788b54 # v1.0.2
        with:
          environments: homepage
          install: false
          download-data: false
      - name: Typecheck
        run: pixi run -e homepage homepage-typecheck
      - name: Build
        run: pixi run -e homepage homepage-build
      - name: Test
        run: |
          pixi run -e homepage playwright install --with-deps chromium
          pixi run -e homepage homepage-test
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: homepage-${{ matrix.site }}
          if-no-files-found: error
          path: doc/homepage/dist

  homepage_publish:
    name: Publish homepage (${{ matrix.site }})
    needs: [homepage_build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Pushes keep both sites in sync; a dryrun checks the main site.
        site: ${{ fromJSON(github.event_name == 'push' && '["dev", "main"]' || (github.event.inputs.target == 'dev' && '["dev"]' || '["main"]')) }}
    env:
      BUCKET: ${{ matrix.site == 'dev' && 'panel-dev.holoviz.org' || 'panel.holoviz.org' }}
      CLOUDFRONT_ID: ${{ matrix.site == 'dev' && 'E148PSI2XBBCSY' || 'EQ3WAHQTFLXVY' }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
      DRYRUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'dryrun' && '--dryrun' || '' }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: homepage-${{ matrix.site }}
          path: dist/
      # Hashed assets go up before the HTML that references them, so a visitor never gets
      # an index.html pointing at files that are not there yet.
      - name: Upload hashed assets
        run: |
          aws s3 sync $DRYRUN --delete dist/_home/ "s3://$BUCKET/_home/" \
            --cache-control max-age=31536000,public
      # Includes /PyodideServiceWorker.js and /pyodide/serviceWorker.js, which retire the
      # workers the old gh-pages site registered.
      - name: Upload unhashed files
        run: |
          aws s3 cp $DRYRUN --recursive dist/ "s3://$BUCKET/" --exclude "_home/*" --exclude index.html \
            --cache-control max-age=300,public
          aws s3 cp $DRYRUN dist/index.html "s3://$BUCKET/index.html" --cache-control max-age=300,public
      # /_home/ needs no invalidation: its filenames change whenever their content does.
      - name: Invalidate CloudFront
        if: env.DRYRUN == ''
        run: |
          paths=("/")
          while IFS= read -r f; do
            paths+=("/${f#dist/}")
          done < <(find dist -type f -not -path 'dist/_home/*')
          aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_ID" --paths "${paths[@]}"
