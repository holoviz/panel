name: docs

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+a[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+b[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+rc[0-9]+"
  workflow_dispatch:
    inputs:
      target:
        description: "Site to build and deploy"
        type: choice
        options:
          - dev
          - main
          - dryrun
        required: true
        default: dryrun
  schedule:
    - cron: "0 19 * * SUN"

defaults:
  run:
    shell: bash -e {0}

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DISPLAY: ":99.0"
  # Prerelease tags and dev dispatches publish to the panel-dev.holoviz.org staging site.
  DEV_DEPLOY: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'dev') || (github.event_name == 'push' && (contains(github.ref_name, 'a') || contains(github.ref_name, 'b') || contains(github.ref_name, 'rc'))) }}

jobs:
  pixi_lock:
    name: Pixi lock
    runs-on: ubuntu-latest
    steps:
      - uses: holoviz-dev/holoviz_tasks/pixi-lock@11eb638302f76ec64217e2eeddfb11df1f788b54 # v1.0.2

  docs_build:
    name: Build Documentation
    needs: [pixi_lock]
    runs-on: "macos-latest"
    timeout-minutes: 180
    steps:
      - uses: holoviz-dev/holoviz_tasks/pixi-install@11eb638302f76ec64217e2eeddfb11df1f788b54 # v1.0.2
        with:
          environments: docs
          opengl: true
      - name: Target the panel-dev staging site
        if: env.DEV_DEPLOY == 'true'
        run: |
          echo "VERSION=dev" >> "$GITHUB_ENV"
          echo "PANEL_DOCS_ORIGIN=https://panel-dev.holoviz.org" >> "$GITHUB_ENV"
      - name: Build documentation
        run: pixi run -e docs docs-build
      # The staging distribution sends X-Robots-Tag: noindex on every response, which
      # crawlers only see on pages robots.txt lets them fetch, so staging allows them all.
      - name: Let crawlers see the staging site's noindex header
        if: env.DEV_DEPLOY == 'true'
        run: printf 'User-agent: *\nAllow: /\n' > builtdocs/_nbsite_versioned/robots.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: docs
          if-no-files-found: error
          path: builtdocs

  docs_publish:
    name: Publish Documentation
    # The weekly scheduled build only checks that the docs still build.
    if: github.event_name != 'schedule'
    runs-on: "ubuntu-latest"
    needs: [docs_build]
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
      MAIN_DISPATCH: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'main' }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docs
          path: builtdocs/
      - name: Select the target site
        run: |
          if [ "$DEV_DEPLOY" = "true" ]; then
            {
              echo "BUCKET=panel-dev.holoviz.org"
              echo "CLOUDFRONT_ID=E148PSI2XBBCSY"
              echo "DOCS_VERSION=dev"
            } >> "$GITHUB_ENV"
          else
            # A manual main deploy publishes under the version in the ref name, so it has to
            # be dispatched from a release tag.
            if [ "$MAIN_DISPATCH" = "true" ] && [ "$GITHUB_REF_TYPE" != "tag" ]; then
              echo "::error::Dispatch the main target from a release tag, e.g. --ref v1.10.0"
              exit 1
            fi
            {
              echo "BUCKET=panel.holoviz.org"
              echo "CLOUDFRONT_ID=EQ3WAHQTFLXVY"
              echo "DOCS_VERSION=${GITHUB_REF_NAME#v}"
            } >> "$GITHUB_ENV"
          fi
      # docs-publish always uploads a root 404.html; hand it back the homepage's so the
      # docs deploy does not replace it with nbsite's generic page.
      - name: Keep the homepage's 404 page
        run: |
          if aws s3api head-object --bucket "$BUCKET" --key 404.html > /dev/null 2>&1; then
            aws s3 cp "s3://$BUCKET/404.html" builtdocs/_nbsite_versioned/404.html
          fi
      - name: Deploy
        uses: holoviz-dev/holoviz_tasks/docs-publish@17107a157b32cc1bd2a09c71fbdbc74603efdb40 # v1.0.15
        with:
          s3-url: s3://${{ env.BUCKET }}
          s3-cloudfront-id: ${{ env.CLOUDFRONT_ID }}
          s3-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          s3-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          version: ${{ env.DOCS_VERSION }}
