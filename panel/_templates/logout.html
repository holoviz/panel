<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title or 'Panel App' }} | Logout</title>
    <link rel="icon" href="{{ page.favicon or PANEL_CDN ~ 'images/favicon.ico' }}">
    {{ page.head }}
  </head>
  <body>
    <header class="pn-appbar">
      {{ page.brand(page.title or 'Panel') }}
    </header>
    <main class="pn-main pn-main--center">
      <form class="pn-paper pn-dialog login-form" action=".{{ LOGIN_ENDPOINT }}" method="get">
        <div class="pn-dialog-header">
          <span class="pn-icon-badge pn-icon-badge--success">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M9 16.17 4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
          </span>
          <h1 class="pn-title">Signed out</h1>
          <p class="pn-subtitle">You have been successfully logged out.</p>
        </div>
        <button class="pn-button pn-button--block" type="submit">Log in again</button>
      </form>
    </main>
  </body>
</html>
