<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title|default("Panel Error", true) }}</title>
    <link rel="apple-touch-icon" sizes="180x180" href="{{ page.favicon or base_url|default("", true) ~ 'static/extensions/panel/images/apple-touch-icon.png' }}">
    <link rel="icon" href="{{ page.favicon or base_url|default("", true) ~ 'static/extensions/panel/images/favicon.ico' }}">
    <link rel="manifest" href="{{ base_url|default("", true) }}static/extensions/panel/images/site.webmanifest">
    {{ page.head }}
    <style>
      {% block extra_style %}{% endblock %}
    </style>
  </head>
  <body>
    <header class="pn-appbar">
      {{ page.brand(page.title or 'Panel') }}
    </header>
    <main class="pn-main pn-main--center">
      <section class="pn-paper pn-dialog pn-dialog--wide" role="alert">
        <div class="pn-dialog-header">
          <span class="pn-icon-badge pn-icon-badge--error">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M1 21h22L12 2zm12-3h-2v-2h2zm0-4h-2v-4h2z"/></svg>
          </span>
          <h1 id="error-type" class="pn-title">{{ error_type|default("Error", true) }}</h1>
          <p id="error" class="pn-subtitle">{{ error|escape }}</p>
        </div>
        {% block content %}
        {% if error_msg %}
        <hr class="pn-divider">
        <p class="pn-body error-message">{{ error_msg }}</p>
        {% endif %}
        {% if oauth_logout_link %}
        <div class="pn-actions">
          <a class="pn-button pn-button--outlined" href="{{ oauth_logout_link }}">Logout</a>
        </div>
        {% endif %}
        {% endblock %}
      </section>
    </main>
  </body>
</html>
